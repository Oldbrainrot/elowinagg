<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Popup</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    .popupGif {
      position: absolute;
      width: 150px;
    }
  </style>
</head>
<body>

<audio src="media/sound.mp3" autoplay loop></audio>

<script>
const gifs = [
  "media/gif1.gif",
  "media/gif2.gif",
  "media/gif3.gif"
];

const numGifs = 5; // liczba „popupów” w jednym oknie
const elements = [];

for (let i = 0; i < numGifs; i++) {
  const img = document.createElement("img");
  img.className = "popupGif";
  img.src = gifs[Math.floor(Math.random() * gifs.length)];

  // startowa pozycja losowa
  img.style.left = Math.random() * (window.innerWidth - 150) + "px";
  img.style.top = Math.random() * (window.innerHeight - 150) + "px";

  // prędkość losowa
  img.dx = (Math.random() * 4 + 2) * (Math.random() < 0.5 ? 1 : -1);
  img.dy = (Math.random() * 4 + 2) * (Math.random() < 0.5 ? 1 : -1);

  document.body.appendChild(img);
  elements.push(img);
}

// animacja
function move() {
  for (const img of elements) {
    let x = parseFloat(img.style.left);
    let y = parseFloat(img.style.top);

    x += img.dx;
    y += img.dy;

    // odbicie od krawędzi
    if (x + img.width >= window.innerWidth || x <= 0) img.dx = -img.dx;
    if (y + img.height >= window.innerHeight || y <= 0) img.dy = -img.dy;

    img.style.left = x + "px";
    img.style.top = y + "px";
  }
}

setInterval(move, 20);
</script>

</body>
</html>
