<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Popup</title>
  <style>
    body {
      margin: 0;
      overflow: hidden; /* ukrywa scroll */
      background: black;
      position: relative;
      height: 100vh;
      width: 100vw;
    }
    #popupGif {
      position: absolute;
      width: 150px; /* rozmiar obrazka */
    }
  </style>
</head>
<body>
  <img id="popupGif" src="media/gif1.gif">
  <audio src="media/sound.mp3" autoplay loop></audio>

  <script>
    const img = document.getElementById("popupGif");

    // startowa pozycja
    let x = Math.random() * (window.innerWidth - 150);
    let y = Math.random() * (window.innerHeight - 150);

    // prędkość ruchu
    let dx = 3;
    let dy = 3;

    function move() {
      x += dx;
      y += dy;

      // odbicie od krawędzi
      if (x + img.width >= window.innerWidth || x <= 0) dx = -dx;
      if (y + img.height >= window.innerHeight || y <= 0) dy = -dy;

      img.style.left = x + "px";
      img.style.top = y + "px";
    }

    setInterval(move, 20); // 50 klatek/s
  </script>
</body>
</html>
