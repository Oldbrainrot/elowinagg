<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>⚠️ UWAGA! BRAINROT</title>

<style>
body {
  background: black;
  color: red;
  font-family: monospace;
  text-align: center;
  padding-top: 30px;
}

#box {
  border: 3px solid red;
  padding: 20px;
  width: 85%;
  margin: auto;
}

#log {
  text-align: left;
  margin-top: 20px;
  height: 200px;
  overflow-y: auto;
  border-top: 1px solid red;
  padding-top: 10px;
}

button {
  margin-top: 20px;
  padding: 10px 25px;
  font-size: 18px;
  cursor: pointer;
  background: black;
  color: red;
  border: 2px solid red;
}

button:hover {
  background: red;
  color: black;
}

/* LEVEL 2 – BSOD */
#overlay {
  position: fixed;
  inset: 0;
  background: black;
  color: #00aaff;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 40px;
  z-index: 9999;
}

#bsod {
  max-width: 800px;
  text-align: left;
}

/* LEVEL 3 – FAKE BIOS */
#bios {
  position: fixed;
  inset: 0;
  background: black;
  color: #9cff9c;
  display: none;
  font-size: 18px;
  padding: 30px;
  text-align: left;
  z-index: 10000;
}

.bios-line { margin: 6px 0; }
</style>
</head>

<body>

<div id="box">
  <h1>⚠️ WYKRYTO BRAINROTA ⚠️</h1>
  <p>Status: <span id="status">Skanowanie systemu...</span></p>
  <p>Postęp: <span id="count">0%</span></p>

  <div id="log"></div>

  <button id="fixBtn" onclick="handleClick()">Napraw komputer</button>
</div>

<!-- LEVEL 2 OVERLAY -->
<div id="overlay">
  <div id="bsod">
    <h1>:(</h1>
    <p>System napotkał krytyczny błąd BRAINROT_EXCEPTION</p>
    <p>Zbieranie informacji...</p>
    <p id="bsodPercent">0%</p>
    <p id="restart"></p>
  </div>
</div>

<!-- LEVEL 3 BIOS -->
<div id="bios"></div>

<!-- DŹWIĘK -->
<audio id="beep">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=">
</audio>

<script>
let percent = 0;
let stage = 0;
let clicks = 0;
let allowNextClick = false;

const log = document.getElementById("log");
const statusText = document.getElementById("status");
const beep = document.getElementById("beep");

const messages = [
  "Analizowanie folderu: memes/",
  "Wykryto plik: skibidi.mp4",
  "Wykryto plik: brainrot.exe",
  "Błąd: za dużo shortów",
  "Stabilizowanie neuronów...",
  "To nie wygląda dobrze..."
];

function addLog(text) {
  const p = document.createElement("p");
  p.textContent = "> " + text;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

const loading = setInterval(() => {
  if (percent < 100) {
    percent++;
    document.getElementById("count").innerText = percent + "%";

    if (percent % 15 === 0 && stage < messages.length) {
      addLog(messages[stage]);
      beep.currentTime = 0;
      beep.play();
      stage++;
    }

    if (percent > 70) statusText.innerText = "Stan krytyczny";
  }
}, 120);

function handleClick() {
  clicks++;

  if (clicks === 1) {
    levelOne();
  } else if (clicks === 2) {
    levelTwo();
  } else if (clicks === 3 && allowNextClick) {
    levelThree();
  }
}

/* LEVEL 1 */
function levelOne() {
  clearInterval(loading);
  statusText.innerText = "Częściowo naprawiono";
  addLog("Naprawa zakończona… chyba.");
  addLog("Zalecane ponowne kliknięcie.");
}

/* LEVEL 2 – BSOD */
function levelTwo() {
  document.getElementById("overlay").style.display = "flex";

  let p = 0;
  const percentText = document.getElementById("bsodPercent");
  const restartText = document.getElementById("restart");

  const bsodLoad = setInterval(() => {
    if (p < 100) {
      p++;
      percentText.innerText = p + "%";
    } else {
      clearInterval(bsodLoad);
      startRestart();
    }
  }, 60);

  function startRestart() {
    let r = 5;
    restartText.innerText = "Restart za " + r + "...";

    const timer = setInterval(() => {
      r--;
      restartText.innerText = "Restart za " + r + "...";

      if (r === 0) {
        clearInterval(timer);
        document.getElementById("overlay").style.display = "none";
        allowNextClick = true;
        statusText.innerText = "Uruchamianie środowiska niskiego poziomu…";
        addLog("Uwaga: wykryto tryb BIOS.");
        addLog("Kliknij jeszcze raz, aby kontynuować.");
      }
    }, 1000);
  }
}

/* LEVEL 3 – FAKE BIOS */
function levelThree() {
  const bios = document.getElementById("bios");
  bios.style.display = "block";
  bios.innerHTML = "";

  const lines = [
    "BRAINROT BIOS v6.66",
    "Copyright (C) 1984-2025",
    "",
    "CPU: Human Brain @ overclocked",
    "RAM: 2GB (1.9GB used by memes)",
    "Checking storage...",
    "WARNING: Skibidi sector corrupted",
    "Loading neural drivers...",
    "Press DEL to enter setup",
    "",
    "POST STATUS:"
  ];

  let i = 0;
  const post = setInterval(() => {
    if (i < lines.length) {
      const div = document.createElement("div");
      div.className = "bios-line";
      div.textContent = lines[i];
      bios.appendChild(div);
      i++;
    } else {
      clearInterval(post);
      biosFinish();
    }
  }, 350);

  function biosFinish() {
    setTimeout(() => {
      document.body.innerHTML = `
        <div style="
          background:black;
          color:lime;
          font-family:monospace;
          height:100vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          text-align:center;">
          <h1>😂 ULTRA PRANK 😂</h1>
          <p>To był FAKE BIOS.</p>
          <p>Widzisz? Nie klika się tylko raz 😉</p>
          <p style="color:gray;margin-top:20px;">
            Komputer jest bezpieczny.<br>
            Brainrot? To już inna sprawa 😏
          </p>
        </div>
      `;
    }, 2000);
  }
}
</script>

</body>
</html>
