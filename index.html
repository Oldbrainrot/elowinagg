<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>⚠️ UWAGA! BRAINROT</title>

<style>
body {
  background: black;
  color: red;
  font-family: monospace;
  text-align: center;
  padding-top: 40px;
}

#box {
  border: 3px solid red;
  padding: 20px;
  width: 85%;
  margin: auto;
}

#log {
  text-align: left;
  margin-top: 20px;
  height: 200px;
  overflow-y: auto;
  border-top: 1px solid red;
  padding-top: 10px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
  background: black;
  color: red;
  border: 2px solid red;
}

button:hover {
  background: red;
  color: black;
}
</style>
</head>

<body>

<div id="box">
  <h1>⚠️ WYKRYTO BRAINROTA ⚠️</h1>
  <p>Status systemu: <span id="status">Skanowanie...</span></p>
  <p>Postęp: <span id="count">0%</span></p>

  <div id="log"></div>

  <button onclick="startFix()">Napraw komputer</button>
</div>

<!-- DŹWIĘK -->
<audio id="beep">
  <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=">
</audio>

<script>
let percent = 0;
let stage = 0;
const log = document.getElementById("log");
const statusText = document.getElementById("status");
const beep = document.getElementById("beep");

const messages = [
  "Analizowanie folderu: memes/",
  "Wykryto podejrzany plik: skibidi.mp4",
  "Wykryto plik: brainrot.exe",
  "Próba izolacji zagrożenia...",
  "Błąd: za dużo TikToka",
  "Ponowna próba...",
  "Stabilizowanie mózgu...",
  "Prawie gotowe..."
];

function addLog(text) {
  const p = document.createElement("p");
  p.textContent = "> " + text;
  log.appendChild(p);
  log.scrollTop = log.scrollHeight;
}

const loading = setInterval(() => {
  if (percent < 100) {
    percent++;
    document.getElementById("count").innerText = percent + "%";

    if (percent % 12 === 0 && stage < messages.length) {
      addLog(messages[stage]);
      beep.currentTime = 0;
      beep.play();
      stage++;
    }

    if (percent > 70) {
      statusText.innerText = "Krytyczny poziom brainrota";
    }
  }
}, 120);

function startFix() {
  clearInterval(loading);

  document.body.innerHTML = `
    <h1 style="color:lime">✅ SYSTEM STABILNY</h1>
    <p style="color:white">To był żart 😄</p>
    <p style="color:gray">Nie ma wirusa, nie ma brainrota.</p>
    <p style="color:gray">Ale ogranicz TikToka 😉</p>
  `;
}
</script>

</body>
</html>
