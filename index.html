<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>🐶 NIE KLIKAJ PSA</title>
<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        cursor: pointer;
    }

    #startImage {
        max-width: 80%;
        max-height: 80%;
        border-radius: 20px;
        box-shadow: 0 0 40px red;
    }

    .popup {
        position: fixed;
        width: 200px;
        pointer-events: none;
        animation: fly 4s linear infinite;
    }

    @keyframes fly {
        from {
            transform: translate(0, 0) rotate(0deg);
        }
        to {
            transform: translate(600px, -600px) rotate(360deg);
        }
    }
</style>
</head>
<body>

<img id="startImage" src="https://zooportal.pl/wp-uploads/770x439_pomeranian-co-to-za-pies-jttn.jpg" alt="pies">

<audio id="music" loop>
    <source src="MUZYKA.mp3" type="audio/mpeg">
</audio>

<script>
let started = false;

const gifs = [
    "https://media.giphy.com/media/3o6Zt481isNVuQI1l6/giphy.gif",
    "https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif",
    "https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif"
];

function startChaos() {
    if (started) return;
    started = true;

    document.body.style.background = "white";

    // muzyka
    const music = document.getElementById("music");
    music.volume = 1.0;
    music.play();

    // popupy
    setInterval(() => {
        const img = document.createElement("img");
        img.src = gifs[Math.floor(Math.random() * gifs.length)];
        img.className = "popup";

        img.style.left = Math.random() * window.innerWidth + "px";
        img.style.top = Math.random() * window.innerHeight + "px";
        img.style.animationDuration = (Math.random() * 2 + 2) + "s";

        document.body.appendChild(img);

        // usuwanie po czasie (żeby nie zabić przeglądarki)
        setTimeout(() => img.remove(), 6000);
    }, 300);
}

// klik
document.getElementById("startImage").addEventListener("click", startChaos);

// spacja
document.addEventListener("keydown", e => {
    if (e.code === "Space") {
        startChaos();
    }
});
</script>

</body>
</html>
